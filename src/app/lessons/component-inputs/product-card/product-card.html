<article class="product-card">
  <div class="product-image">
    <span class="image-label">STUDIO / 01</span>
    <svg viewBox="0 0 240 180" role="img" aria-label="Зелені накладні навушники">
      <path d="M58 111V83a62 62 0 0 1 124 0v28" fill="none" stroke="#354d3a" stroke-width="17" stroke-linecap="round" />
      <path d="M58 86a62 62 0 0 1 124 0" fill="none" stroke="#829477" stroke-width="7" />
      <rect x="42" y="87" width="35" height="64" rx="16" fill="#597052" />
      <rect x="66" y="93" width="15" height="52" rx="7" fill="#2d4031" />
      <rect x="163" y="87" width="35" height="64" rx="16" fill="#597052" />
      <rect x="159" y="93" width="15" height="52" rx="7" fill="#2d4031" />
    </svg>
    <span class="image-caption">EVERYDAY SOUND, REFINED.</span>
  </div>
  <div class="product-details">
    <!-- Практика: заміни статичні значення на інтерполяцію inputs. -->
    <p class="category">{{category()}}</p>
    <h2>{{name()}}</h2>
    <p class="product-description" >{{category()}}</p>
    <div class="product-footer"><span class="price" [class.expensive]='price()>100'>4 200 <small>₴</small></span><span class="preview-label">ПРЕВ’Ю КАРТКИ</span></div>
  </div>
</article>
